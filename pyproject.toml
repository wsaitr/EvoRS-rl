[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-hmcomm"
version = "0.1.0"
description = "Hierarchical multimodal communication starter for remote-sensing multi-agent RL"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "PyYAML>=6",
    "langgraph>=1.2.11,<1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["datasets>=2.19", "Pillow>=10", "PyYAML>=6"]
vlm = [
    "torch>=2.2",
    "transformers>=4.50,<6",
    "accelerate>=1.0",
    "peft>=0.13",
    "qwen-vl-utils>=0.0.8,<1",
]
obs = ["esdk-obs-python>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_vlm: requires a locally available real vision-language model",
    "live_encoder: requires a locally available real vision encoder",
]
